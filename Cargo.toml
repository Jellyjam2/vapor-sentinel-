[package]
name = "vapor_project"
version = "0.1.0"
edition = "2021"

[dependencies]
# CORE PARSER
pest = "2.7"
pest_derive = "2.7"

# 2150 SECURITY
zeroize = { version = "1.7", features = ["derive"] }
region = "3.0" 

# SYSTEM & NETWORKING
anyhow = "1.0"
ureq = "2.12"
sysinfo = "0.29.11"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WASM ENGINE
wasmtime = "16.0"

[profile.dev]
opt-level = 2
codegen-units = 256
