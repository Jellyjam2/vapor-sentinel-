[package]
name = "vapor_project"
version = "0.1.0"
edition = "2021"
authors = ["Titan Black Swan TECHNOLOGIES"]
description = "Vapor Sentinel — defensive system monitoring engine by Titan Black Swan TECHNOLOGIES."

[dependencies]
pest = "2.7"
pest_derive = "2.7"
anyhow = "1.0"
ureq = "2.12"
sysinfo = "0.29.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 2
codegen-units = 256
