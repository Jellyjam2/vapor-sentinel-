name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VAPOR_SENTINEL_ENABLE_ACTIONS: "0"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and executable integration tests
        run: cargo test --locked --all-targets
      - name: Viewer schema and interaction tests
        run: node --test tests/dashboard.test.cjs
      - name: Validate shipped configuration
        run: cargo run --locked -- --check
      - name: Replay smoke test (network always disabled)
        run: cargo run --locked -- --replay tests/fixtures/memory-sequence.json > smoke-evidence.jsonl
      - name: Build release
        run: cargo build --locked --release
      - name: Upload checkpoint artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vapor-sentinel-${{ matrix.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/vapor_project
            target/release/vapor_project.exe
            vapor-sentinel.json
            policies/default.vapor
            smoke-evidence.jsonl
            Cargo.lock

  security_audit:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the committed dependency resolution
        run: cargo audit --file Cargo.lock
