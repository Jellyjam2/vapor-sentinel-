name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  STABLE_RUST: "1.99.0"

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.rust }}" = "stable" ]; then
            rustup toolchain install "${STABLE_RUST}" --profile minimal
          else
            rustup toolchain install nightly --profile minimal
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.rust }}" = "stable" ]; then
            cargo +${STABLE_RUST} test --verbose
          else
            cargo +nightly test --verbose
          fi

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "${STABLE_RUST}" --profile minimal --component rustfmt
      - name: Check formatting
        shell: bash
        run: cargo +${STABLE_RUST} fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "${STABLE_RUST}" --profile minimal --component clippy
      - name: Run Clippy
        shell: bash
        run: cargo +${STABLE_RUST} clippy --all-targets --all-features -- -D warnings

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "${STABLE_RUST}" --profile minimal
      - name: Install cargo-audit
        shell: bash
        run: cargo +${STABLE_RUST} install cargo-audit --locked
      - name: Run cargo audit
        shell: bash
        run: cargo +${STABLE_RUST} audit

  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "${STABLE_RUST}" --profile minimal
      - name: Build release
        shell: bash
        run: cargo +${STABLE_RUST} build --release --verbose
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vapor-sentinel-${{ matrix.os }}
          path: target/release/vapor_project*
