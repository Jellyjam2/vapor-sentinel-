name: Actions Runner Probe

on:
  push:
    branches:
      - feat/evidence-dashboard-foundation
  pull_request:
    branches:
      - main

jobs:
  probe:
    name: Runner Probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe runner
        run: |
          echo "runner-started"
          uname -a
          rustc --version
